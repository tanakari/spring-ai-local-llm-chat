services:
  ovms:
    image: openvino/model_server:2026.4.0-gpu

    # Compose が .env から読み込むホストユーザーの UID/GID
    user: "${LOCAL_UID:?LOCAL_UID を設定してください}:${LOCAL_GID:?LOCAL_GID を設定してください}"

    ports:
      - "127.0.0.1:8000:8000"

    devices:
      - /dev/dxg:/dev/dxg

    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - ./models:/models:rw

    command:
      - --source_model
      - OpenVINO/gemma-4-E4B-it-int4-ov
      - --model_repository_path
      - /models
      - --model_name
      - gemma4-e4b
      - --task
      - text_generation
      - --pipeline_type
      - VLM_CB
      - --target_device
      - GPU
      - --enable_prefix_caching
      - "false"
      - --rest_port
      - "8000"
      # Gemma 4 E4B の GPU 実行に必要な設定
      - --plugin_config
      - '{"GPU_ENABLE_LARGE_ALLOCATIONS": true}'

    restart: unless-stopped