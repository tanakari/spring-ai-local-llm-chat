services:
  ovms:
    image: openvino/model_server:2026.4.0-gpu
    # .env の LOCAL_UID/LOCAL_GID が必須
    user: "${LOCAL_UID}:${LOCAL_GID}"

    ports:
      - "127.0.0.1:8000:8000"

    devices:
      - /dev/dxg:/dev/dxg

    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - ./models:/models:rw
    env_file:
      - .env
    command:
      - --source_model
      - OpenVINO/gemma-4-E4B-it-int4-ov
      - --model_repository_path
      - /models
      - --model_name
      - gemma4-e4b
      - --task
      - text_generation
      - --pipeline_type
      - VLM_CB
      - --target_device
      - GPU
      - --enable_prefix_caching
      - "false"
      - --rest_port
      - "8000"
      # このモデルは GPU_ENABLE_LARGE_ALLOCATIONS=true が必須（false では起動失敗）
      - --plugin_config
      - '{"GPU_ENABLE_LARGE_ALLOCATIONS": true}'
    restart: unless-stopped
