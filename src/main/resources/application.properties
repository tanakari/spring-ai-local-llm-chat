spring.application.name=spring-ai-local-llm-chat

# --- OpenVINO Model Server (OpenAI 互換 API) 接続設定 ---
# OVMS は API キーを検証しないが、OpenAI クライアント側でクレデンシャル必須のためダミーを設定
spring.ai.openai.api-key=dummy-key
# ローカル推論の失敗時に再生成を繰り返さず、原因を確認できるようにする
spring.ai.openai.max-retries=0
# 遅いローカル推論が完了するか確認するため、待ち時間を延長する
spring.ai.openai.timeout=${OVMS_TIMEOUT:3m}
# OVMS は chat/completions 応答に id を含まないため、アプリ内のインターセプターで補完する。
# Spring AI 2.x は公式 OpenAI SDK が base-url に /chat/completions を自動で付けるため、/v1 まで含めて指定する
spring.ai.openai.chat.base-url=${OVMS_BASE_URL:http://127.0.0.1:8000/v1}
# compose.yaml の --model_name に合わせること
spring.ai.openai.chat.model=${OVMS_MODEL:gemma4-e4b}


# チャット以外の使わない OpenAI モデルの自動設定を無効化
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
