<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local LLM Chat</title>
  <style>
    body { max-width: 800px; margin: 24px auto; padding: 0 16px; font: 16px/1.6 system-ui, sans-serif; color: #202331; background: #fff; }
    h1 { font-size: 24px; }
    .notice { padding: 12px; border: 1px solid #b7791f; background: #fff8e6; color: #633f0b; }
    deep-chat { display: block; box-sizing: border-box; width: 100%; height: 65vh; min-height: 320px; }
  </style>
  <script type="module" src="https://unpkg.com/deep-chat@2.5.1/dist/deepChat.bundle.js"></script>
  <script src="/chat.js" defer></script>
</head>
<body>
  <h1>Local LLM Chat</h1>
  <p class="notice">ローカルのテスト専用です。Deep Chat 2.5.1 には XSS の報告があります。本番利用・外部公開は避け、機密情報を入力したり、回答内の不審なリンクを開いたりしないでください。</p>
  <p>モデルに送るのは今回の質問だけです。再読み込みすると表示履歴は消えます。</p>
  <deep-chat id="chat" aria-label="モデルへの質問"
    requestBodyLimits='{"maxMessages":1}'
    textInput='{"placeholder":{"text":"質問を入力してください"}}'>
  </deep-chat>
  <noscript>この画面を使うには JavaScript を有効にしてください。</noscript>
</body>
</html>
